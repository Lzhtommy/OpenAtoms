[project]
name = "openatoms-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-socketio>=5.11",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "redis>=5.0",
  "arq>=0.26",
  "boto3>=1.34",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "docker>=7.1",
  "playwright>=1.47",
  "prometheus-client>=0.26.0",
  "pillow>=13.0.0",
  "pypdf>=6.21.4",
  "python-docx>=1.2.0",
  "fpdf2>=2.9.0",
]

[project.optional-dependencies]
observability = [
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-sdk>=1.27",
    "sentry-sdk[fastapi]>=2.14",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oa"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "ASYNC", "RUF100"]
ignore = ["B008", "E501", "ASYNC109", "ASYNC220", "ASYNC230", "ASYNC240", "UP017", "UP042"]

[tool.ruff.lint.per-file-ignores]
# tests configure env before importing oa, and use blocking subprocess/HTTP helpers deliberately
"tests/**" = ["E402", "ASYNC110", "ASYNC210", "ASYNC221"]
