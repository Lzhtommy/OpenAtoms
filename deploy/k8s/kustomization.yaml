apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No global `namespace:` transform: it would rename both Namespace objects and pull the sandbox-side
# objects (NetworkPolicy/ResourceQuota/Role in openatoms-sandboxes) into openatoms. Namespaces are explicit.
resources: [namespace.yaml, config.yaml, rbac.yaml, sandbox-policy.yaml, api.yaml, worker.yaml, gateway.yaml, web.yaml, ingress.yaml]
