apiVersion: apps/v1
kind: Deployment
metadata: { name: oa-gateway, namespace: openatoms }
spec:
  replicas: 2
  selector: { matchLabels: { app: oa-gateway } }
  template:
    metadata:
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: "/__oa/metrics" }
      labels: { app: oa-gateway }
    spec:
      containers:
        - name: gateway
          image: openatoms/gateway:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: GATEWAY_LISTEN, value: ":8080" }
          envFrom: [{ configMapRef: { name: oa-config } }, { secretRef: { name: oa-secrets } }]
---
apiVersion: v1
kind: Service
metadata: { name: oa-gateway, namespace: openatoms }
spec: { selector: { app: oa-gateway }, ports: [{ port: 8080, targetPort: 8080 }] }
