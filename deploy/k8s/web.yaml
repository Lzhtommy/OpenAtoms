apiVersion: apps/v1
kind: Deployment
metadata: { name: oa-web, namespace: openatoms }
spec:
  replicas: 2
  selector: { matchLabels: { app: oa-web } }
  template:
    metadata: { labels: { app: oa-web } }
    spec:
      containers:
        - name: web
          image: openatoms/web:latest
          ports: [{ containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: oa-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: oa-web, namespace: openatoms }
spec: { selector: { app: oa-web }, ports: [{ port: 3000, targetPort: 3000 }] }
